spring.application.name=SOA5
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/reports_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=YOUR_MYSQL_USERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.auth-service-url=http://localhost:8081/auth
product.service-url=http://localhost:8082
order.service-url=http://localhost:8083
